            <option value="admin">Admin</option>

        </select>
       </div>
       <div id="notificaciones">
        <i></i>
       </div>

    </section>
    <section id="zone_sidebar">
        <aside id="sidebar">
            <nav id="inicio">
                <a href="#">Inicio</a>
                <i></i>
            </nav>
            <nav id="ingresos">

                <i></i>

            <nav id="taller">

    <section id="zona_registro">
        <div>
            <h3>Registro de ususario</h3>
            <p>Usuario > Registro de usuario</p>
        </div>
        <div id="zona_informacion">
            <i></i>
            <h4>Informacion del usuario</h4>
            <p>Completa los datos para registrar un nuevo usuario en el sistema</p>
            <label>Nombre*</label>
            <div>
                 <input type="text" placeholder="Ingrese su nombre">
            </div>
            <label>Apellido*</label>
            <div>
                <input type="text" placeholder="Ingrese su apellido">
            </div>
            <label>Correo Electronico*</label>
            <div>
                <input type="email" placeholder="Ej: usuario@ejemplo.com">
                <i></i>
            </div>
            <label>Telefono*</label>
            <div>
                <input type="tel" placeholder="Ej: 3001234567">
                <i></i>
            </div>
            <label>Documento De Identidad*</label>
            <div>
                <input type="text" placeholder="Ej: 123456789">
                <i></i>
            </div>
        </div>

    </section>
